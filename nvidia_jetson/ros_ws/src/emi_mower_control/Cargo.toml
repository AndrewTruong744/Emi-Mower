[package]
name = "emi_mower_control"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "ROS-to-STM32 CAN bridge and shared control contract for Emi Mower."

[[bin]]
name = "stm32_bridge"
path = "src/bin/stm32_bridge.rs"

[[bin]]
name = "sim_command_sink"
path = "src/bin/sim_command_sink.rs"

[dependencies]
anyhow = "1"
geometry_msgs = "*"
rclrs = "0.7"
socketcan = "3.6"
thiserror = "2"
