openapi: 3.1.0
info:
  title: Emi Mower Problem Details
  version: 1.0.0
  description: RFC 9457 problem-detail definitions for HTTP and Zenoh responses.

components:
  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status, detail, instance, code, timestamp]
      properties:
        type:
          type: string
          format: uri
          example: https://emi-mower.dev/problems/authentication-failed
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string}
        code: {type: string}
        timestamp: {type: string, format: date-time}
      additionalProperties: true
    AuthenticationError: {$ref: '#/components/schemas/ProblemDetails'}
    BaseAppException: {$ref: '#/components/schemas/ProblemDetails'}
    NotFoundError: {$ref: '#/components/schemas/ProblemDetails'}
    ValidationError: {$ref: '#/components/schemas/ProblemDetails'}
    UserNotFoundError: {$ref: '#/components/schemas/ProblemDetails'}
    MowerNotFoundError: {$ref: '#/components/schemas/ProblemDetails'}
    ForbiddenError: {$ref: '#/components/schemas/ProblemDetails'}
    OwnershipError: {$ref: '#/components/schemas/ProblemDetails'}
    RepositoryError: {$ref: '#/components/schemas/ProblemDetails'}
    ExternalServiceError: {$ref: '#/components/schemas/ProblemDetails'}
    TokenGenerationError: {$ref: '#/components/schemas/ProblemDetails'}
    InternalError: {$ref: '#/components/schemas/ProblemDetails'}
