asyncapi: 3.0.0
info:
  title: Emi Mower Zenoh API
  version: 1.0.0
  description: >-
    The user/login exchange accepts a Firebase ID token and returns an
    application JWT signed with JWT_SECRET. Authenticated user and mower
    operations accept a Firebase ID token and return a typed reply. LiveKit
    query paths issue room-scoped tokens for either an app consumer or a mower
    publisher.
servers:
  public:
    host: localhost:7447
    protocol: ws
    description: Public Zenoh router endpoint
channels:
  userLogin:
    address: user/login
    messages:
      userLoginRequest: {$ref: '#/components/messages/UserLoginRequest'}
      userLoginResponse: {$ref: '#/components/messages/UserLoginResponse'}
      problemDetails: {$ref: '#/components/messages/ProblemDetails'}
  addMowerToUser:
    address: user/add_mower
    messages:
      addMowerToUserRequest: {$ref: '#/components/messages/AddMowerToUserRequest'}
      addMowerToUserResponse: {$ref: '#/components/messages/AddMowerToUserResponse'}
      problemDetails: {$ref: '#/components/messages/ProblemDetails'}
  updateUserName:
    address: user/update_name
    messages:
      updateUserNameRequest: {$ref: '#/components/messages/UpdateUserNameRequest'}
      updateUserNameResponse: {$ref: '#/components/messages/UpdateUserNameResponse'}
      problemDetails: {$ref: '#/components/messages/ProblemDetails'}
  updateMowerName:
    address: mower/{mower_id}/update_name
    parameters:
      mower_id:
        description: Mower whose name is being updated.
    messages:
      updateMowerNameRequest: {$ref: '#/components/messages/UpdateMowerNameRequest'}
      updateMowerNameResponse: {$ref: '#/components/messages/UpdateMowerNameResponse'}
      problemDetails: {$ref: '#/components/messages/ProblemDetails'}
  updateUserEmail:
    address: user/update_email
    messages:
      updateUserEmailRequest: {$ref: '#/components/messages/UpdateUserEmailRequest'}
      updateUserEmailResponse: {$ref: '#/components/messages/UpdateUserEmailResponse'}
      problemDetails: {$ref: '#/components/messages/ProblemDetails'}
  livekitConsume:
    address: mower/{mower_id}/livekit/consume
    parameters:
      mower_id:
        description: Mower room to consume.
    messages:
      livekitConsumeRequest: {$ref: '#/components/messages/LiveKitConsumeRequest'}
      livekitTokenResponse: {$ref: '#/components/messages/LiveKitTokenResponse'}
      problemDetails: {$ref: '#/components/messages/ProblemDetails'}
  livekitUpload:
    address: mower/{mower_id}/livekit/upload
    parameters:
      mower_id:
        description: Mower room to publish.
    messages:
      livekitUploadRequest: {$ref: '#/components/messages/LiveKitUploadRequest'}
      livekitTokenResponse: {$ref: '#/components/messages/LiveKitTokenResponse'}
      problemDetails: {$ref: '#/components/messages/ProblemDetails'}
  mowerJoystick:
    address: mower/{mower_id}/joystick
    parameters:
      mower_id:
        description: Mower receiving the normalized joystick command.
    messages:
      joystickCommand: {$ref: '#/components/messages/JoystickCommand'}
  mowerCommand:
    address: mower/{mower_id}/command
    parameters:
      mower_id:
        description: Mower receiving a one-off control command.
    messages:
      mowerCommandRequest: {$ref: '#/components/messages/MowerCommandRequest'}
      mowerCommandResponse: {$ref: '#/components/messages/MowerCommandResponse'}
      problemDetails: {$ref: '#/components/messages/ProblemDetails'}
  mowerTelemetryHistory:
    address: mower/{mower_id}/telemetry/{telemetry_type}/old
    parameters:
      mower_id:
        description: Mower whose historical graph telemetry is requested.
      telemetry_type:
        description: Graph metric, such as left_motor_speed or accel_x.
    messages:
      telemetryHistoryRequest: {$ref: '#/components/messages/TelemetryHistoryRequest'}
      telemetryHistoryResponse: {$ref: '#/components/messages/TelemetryHistoryResponse'}
      problemDetails: {$ref: '#/components/messages/ProblemDetails'}
  mowerTelemetry:
    address: mower/{mower_id}/telemetry
    parameters:
      mower_id:
        description: Mower that published this live telemetry batch.
    messages:
      telemetryList: {$ref: '#/components/messages/TelemetryList'}
  cutoutUploadUrl:
    address: user/cutouts/upload-url
    messages:
      cutoutUploadUrlRequest: {$ref: '#/components/messages/CutoutUploadUrlRequest'}
      cutoutUploadUrlResponse: {$ref: '#/components/messages/CutoutUploadUrlResponse'}
      problemDetails: {$ref: '#/components/messages/ProblemDetails'}
  cutoutUploaded:
    address: user/cutouts/uploaded
    messages:
      cutoutUploadNotification: {$ref: '#/components/messages/CutoutUploadNotification'}
  mowerCutoutDownloadUrl:
    address: mower/{mower_id}/cutout/download-url
    parameters:
      mower_id:
        description: Mower retrieving its most recently assigned verified cutout.
    messages:
      mowerCutoutDownloadUrlRequest: {$ref: '#/components/messages/MowerCutoutDownloadUrlRequest'}
      mowerCutoutDownloadUrlResponse: {$ref: '#/components/messages/MowerCutoutDownloadUrlResponse'}
      problemDetails: {$ref: '#/components/messages/ProblemDetails'}
  mowerCertificateRenewChallenge:
    address: bootstrap/mower/{mower_id}/certificate/renew/challenge
    parameters:
      mower_id:
        description: Mower whose registered TPM device-root key will answer the challenge.
    messages:
      mowerCertificateRenewChallengeRequest: {$ref: '#/components/messages/MowerCertificateRenewChallengeRequest'}
      mowerCertificateRenewChallengeResponse: {$ref: '#/components/messages/MowerCertificateRenewChallengeResponse'}
      problemDetails: {$ref: '#/components/messages/ProblemDetails'}
  mowerCertificateRenewComplete:
    address: bootstrap/mower/{mower_id}/certificate/renew/complete
    parameters:
      mower_id:
        description: Mower completing a TPM-signed operational certificate renewal.
    messages:
      mowerCertificateRenewCompleteRequest: {$ref: '#/components/messages/MowerCertificateRenewCompleteRequest'}
      mowerCertificateRenewCompleteResponse: {$ref: '#/components/messages/MowerCertificateRenewCompleteResponse'}
      problemDetails: {$ref: '#/components/messages/ProblemDetails'}
operations:
  userLogin:
    action: receive
    channel: {$ref: '#/channels/userLogin'}
    summary: Exchange a Firebase ID token for an Emi Mower JWT
    messages:
      - {$ref: '#/channels/userLogin/messages/userLoginRequest'}
    reply:
      channel: {$ref: '#/channels/userLogin'}
      messages:
        - {$ref: '#/channels/userLogin/messages/userLoginResponse'}
        - {$ref: '#/channels/userLogin/messages/problemDetails'}
  addMowerToUser:
    action: receive
    channel: {$ref: '#/channels/addMowerToUser'}
    summary: Assign an unowned mower to the authenticated user
    messages:
      - {$ref: '#/channels/addMowerToUser/messages/addMowerToUserRequest'}
    reply:
      channel: {$ref: '#/channels/addMowerToUser'}
      messages:
        - {$ref: '#/channels/addMowerToUser/messages/addMowerToUserResponse'}
        - {$ref: '#/channels/addMowerToUser/messages/problemDetails'}
  updateUserName:
    action: receive
    channel: {$ref: '#/channels/updateUserName'}
    summary: Update the authenticated user's name
    messages:
      - {$ref: '#/channels/updateUserName/messages/updateUserNameRequest'}
    reply:
      channel: {$ref: '#/channels/updateUserName'}
      messages:
        - {$ref: '#/channels/updateUserName/messages/updateUserNameResponse'}
        - {$ref: '#/channels/updateUserName/messages/problemDetails'}
  updateMowerName:
    action: receive
    channel: {$ref: '#/channels/updateMowerName'}
    summary: Update the name of a mower owned by the authenticated user
    messages:
      - {$ref: '#/channels/updateMowerName/messages/updateMowerNameRequest'}
    reply:
      channel: {$ref: '#/channels/updateMowerName'}
      messages:
        - {$ref: '#/channels/updateMowerName/messages/updateMowerNameResponse'}
        - {$ref: '#/channels/updateMowerName/messages/problemDetails'}
  updateUserEmail:
    action: receive
    channel: {$ref: '#/channels/updateUserEmail'}
    summary: Update the authenticated user's email from a verified ID token
    messages:
      - {$ref: '#/channels/updateUserEmail/messages/updateUserEmailRequest'}
    reply:
      channel: {$ref: '#/channels/updateUserEmail'}
      messages:
        - {$ref: '#/channels/updateUserEmail/messages/updateUserEmailResponse'}
        - {$ref: '#/channels/updateUserEmail/messages/problemDetails'}
  livekitConsume:
    action: receive
    channel: {$ref: '#/channels/livekitConsume'}
    summary: Issue an app-user token for consuming a mower's LiveKit room
    messages:
      - {$ref: '#/channels/livekitConsume/messages/livekitConsumeRequest'}
    reply:
      channel: {$ref: '#/channels/livekitConsume'}
      messages:
        - {$ref: '#/channels/livekitConsume/messages/livekitTokenResponse'}
        - {$ref: '#/channels/livekitConsume/messages/problemDetails'}
  livekitUpload:
    action: receive
    channel: {$ref: '#/channels/livekitUpload'}
    summary: Issue a mower token for uploading to its LiveKit room
    messages:
      - {$ref: '#/channels/livekitUpload/messages/livekitUploadRequest'}
    reply:
      channel: {$ref: '#/channels/livekitUpload'}
      messages:
        - {$ref: '#/channels/livekitUpload/messages/livekitTokenResponse'}
        - {$ref: '#/channels/livekitUpload/messages/problemDetails'}
  mowerJoystick:
    action: send
    channel: {$ref: '#/channels/mowerJoystick'}
    summary: Send a normalized joystick command to a mower
    messages:
      - {$ref: '#/channels/mowerJoystick/messages/joystickCommand'}
  mowerCommand:
    action: receive
    channel: {$ref: '#/channels/mowerCommand'}
    summary: Request a one-off mower control action and receive its acceptance result
    messages:
      - {$ref: '#/channels/mowerCommand/messages/mowerCommandRequest'}
    reply:
      channel: {$ref: '#/channels/mowerCommand'}
      messages:
        - {$ref: '#/channels/mowerCommand/messages/mowerCommandResponse'}
        - {$ref: '#/channels/mowerCommand/messages/problemDetails'}
  mowerTelemetryHistory:
    action: receive
    channel: {$ref: '#/channels/mowerTelemetryHistory'}
    summary: Get an owned mower's paginated historical graph telemetry
    messages:
      - {$ref: '#/channels/mowerTelemetryHistory/messages/telemetryHistoryRequest'}
    reply:
      channel: {$ref: '#/channels/mowerTelemetryHistory'}
      messages:
        - {$ref: '#/channels/mowerTelemetryHistory/messages/telemetryHistoryResponse'}
        - {$ref: '#/channels/mowerTelemetryHistory/messages/problemDetails'}
  mowerTelemetry:
    action: receive
    channel: {$ref: '#/channels/mowerTelemetry'}
    summary: Receive a mower's live telemetry batch for buffering and fan-out
    messages:
      - {$ref: '#/channels/mowerTelemetry/messages/telemetryList'}
  cutoutUploadUrl:
    action: receive
    channel: {$ref: '#/channels/cutoutUploadUrl'}
    summary: Authorize a cutout upload and return a short-lived GCS signed PUT URL
    messages:
      - {$ref: '#/channels/cutoutUploadUrl/messages/cutoutUploadUrlRequest'}
    reply:
      channel: {$ref: '#/channels/cutoutUploadUrl'}
      messages:
        - {$ref: '#/channels/cutoutUploadUrl/messages/cutoutUploadUrlResponse'}
        - {$ref: '#/channels/cutoutUploadUrl/messages/problemDetails'}
  cutoutUploaded:
    action: receive
    channel: {$ref: '#/channels/cutoutUploaded'}
    summary: Verify an app cutout upload after the signed PUT completes
    messages:
      - {$ref: '#/channels/cutoutUploaded/messages/cutoutUploadNotification'}
  mowerCutoutDownloadUrl:
    action: receive
    channel: {$ref: '#/channels/mowerCutoutDownloadUrl'}
    summary: Return a fresh signed GET URL for a mower's latest verified cutout
    messages:
      - {$ref: '#/channels/mowerCutoutDownloadUrl/messages/mowerCutoutDownloadUrlRequest'}
    reply:
      channel: {$ref: '#/channels/mowerCutoutDownloadUrl'}
      messages:
        - {$ref: '#/channels/mowerCutoutDownloadUrl/messages/mowerCutoutDownloadUrlResponse'}
        - {$ref: '#/channels/mowerCutoutDownloadUrl/messages/problemDetails'}
  mowerCertificateRenewChallenge:
    action: receive
    channel: {$ref: '#/channels/mowerCertificateRenewChallenge'}
    summary: Issue a one-time TPM renewal challenge for a mower
    messages:
      - {$ref: '#/channels/mowerCertificateRenewChallenge/messages/mowerCertificateRenewChallengeRequest'}
    reply:
      channel: {$ref: '#/channels/mowerCertificateRenewChallenge'}
      messages:
        - {$ref: '#/channels/mowerCertificateRenewChallenge/messages/mowerCertificateRenewChallengeResponse'}
        - {$ref: '#/channels/mowerCertificateRenewChallenge/messages/problemDetails'}
  mowerCertificateRenewComplete:
    action: receive
    channel: {$ref: '#/channels/mowerCertificateRenewComplete'}
    summary: Verify TPM proof and issue a replacement operational mower certificate
    messages:
      - {$ref: '#/channels/mowerCertificateRenewComplete/messages/mowerCertificateRenewCompleteRequest'}
    reply:
      channel: {$ref: '#/channels/mowerCertificateRenewComplete'}
      messages:
        - {$ref: '#/channels/mowerCertificateRenewComplete/messages/mowerCertificateRenewCompleteResponse'}
        - {$ref: '#/channels/mowerCertificateRenewComplete/messages/problemDetails'}
components:
  messages:
    UserLoginRequest:
      name: UserLoginRequest
      payload: {$ref: '#/components/schemas/UserLoginRequest'}
    UserLoginResponse:
      name: UserLoginResponse
      payload: {$ref: '#/components/schemas/UserLoginResponse'}
    AddMowerToUserRequest:
      name: AddMowerToUserRequest
      payload: {$ref: '#/components/schemas/AddMowerToUserRequest'}
    AddMowerToUserResponse:
      name: AddMowerToUserResponse
      payload: {$ref: '#/components/schemas/AddMowerToUserResponse'}
    UpdateUserNameRequest:
      name: UpdateUserNameRequest
      payload: {$ref: '#/components/schemas/UpdateUserNameRequest'}
    UpdateUserNameResponse:
      name: UpdateUserNameResponse
      payload: {$ref: '#/components/schemas/UpdateUserNameResponse'}
    UpdateMowerNameRequest:
      name: UpdateMowerNameRequest
      payload: {$ref: '#/components/schemas/UpdateMowerNameRequest'}
    UpdateMowerNameResponse:
      name: UpdateMowerNameResponse
      payload: {$ref: '#/components/schemas/UpdateMowerNameResponse'}
    UpdateUserEmailRequest:
      name: UpdateUserEmailRequest
      payload: {$ref: '#/components/schemas/UpdateUserEmailRequest'}
    UpdateUserEmailResponse:
      name: UpdateUserEmailResponse
      payload: {$ref: '#/components/schemas/UpdateUserEmailResponse'}
    ProblemDetails:
      name: ProblemDetails
      payload: {$ref: '#/components/schemas/ProblemDetails'}
    LiveKitConsumeRequest:
      name: LiveKitConsumeRequest
      payload: {$ref: '#/components/schemas/LiveKitConsumeRequest'}
    LiveKitUploadRequest:
      name: LiveKitUploadRequest
      payload: {$ref: '#/components/schemas/LiveKitUploadRequest'}
    LiveKitTokenResponse:
      name: LiveKitTokenResponse
      payload: {$ref: '#/components/schemas/LiveKitTokenResponse'}
    JoystickCommand:
      name: JoystickCommand
      payload: {$ref: '#/components/schemas/JoystickCommand'}
    MowerCommandRequest:
      name: MowerCommandRequest
      payload: {$ref: '#/components/schemas/MowerCommandRequest'}
    MowerCommandResponse:
      name: MowerCommandResponse
      payload: {$ref: '#/components/schemas/MowerCommandResponse'}
    TelemetryHistoryRequest:
      name: TelemetryHistoryRequest
      payload: {$ref: '#/components/schemas/TelemetryHistoryRequest'}
    TelemetryHistoryResponse:
      name: TelemetryHistoryResponse
      payload: {$ref: '#/components/schemas/TelemetryHistoryResponse'}
    TelemetryList:
      name: TelemetryList
      payload: {$ref: '#/components/schemas/TelemetryList'}
    CutoutUploadUrlRequest:
      name: CutoutUploadUrlRequest
      payload: {$ref: '#/components/schemas/CutoutUploadUrlRequest'}
    CutoutUploadUrlResponse:
      name: CutoutUploadUrlResponse
      payload: {$ref: '#/components/schemas/CutoutUploadUrlResponse'}
    CutoutUploadNotification:
      name: CutoutUploadNotification
      payload: {$ref: '#/components/schemas/CutoutUploadNotification'}
    MowerCutoutDownloadUrlRequest:
      name: MowerCutoutDownloadUrlRequest
      payload: {$ref: '#/components/schemas/MowerCutoutDownloadUrlRequest'}
    MowerCutoutDownloadUrlResponse:
      name: MowerCutoutDownloadUrlResponse
      payload: {$ref: '#/components/schemas/MowerCutoutDownloadUrlResponse'}
    MowerCertificateRenewChallengeRequest:
      name: MowerCertificateRenewChallengeRequest
      payload: {$ref: '#/components/schemas/MowerCertificateRenewChallengeRequest'}
    MowerCertificateRenewChallengeResponse:
      name: MowerCertificateRenewChallengeResponse
      payload: {$ref: '#/components/schemas/MowerCertificateRenewChallengeResponse'}
    MowerCertificateRenewCompleteRequest:
      name: MowerCertificateRenewCompleteRequest
      payload: {$ref: '#/components/schemas/MowerCertificateRenewCompleteRequest'}
    MowerCertificateRenewCompleteResponse:
      name: MowerCertificateRenewCompleteResponse
      payload: {$ref: '#/components/schemas/MowerCertificateRenewCompleteResponse'}
  schemas:
    UserLoginRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          description: Firebase Identity Platform ID token.
    AddMowerToUserRequest:
      type: object
      required: [id_token, mower_id]
      additionalProperties: false
      properties:
        id_token:
          type: string
          description: Firebase Identity Platform ID token.
        mower_id: {type: string}
    AddMowerToUserResponse:
      type: object
      required: [message, user_id, mower_id]
      additionalProperties: false
      properties:
        message: {type: string}
        user_id: {type: string}
        mower_id: {type: string}
    UpdateUserNameRequest:
      type: object
      required: [id_token, new_user_name]
      additionalProperties: false
      properties:
        id_token:
          type: string
          description: Firebase Identity Platform ID token.
        new_user_name: {type: string}
    UpdateUserNameResponse:
      type: object
      required: [message, user_id, new_user_name]
      additionalProperties: false
      properties:
        message: {type: string}
        user_id: {type: string}
        new_user_name: {type: string}
    UpdateMowerNameRequest:
      type: object
      required: [id_token, new_name]
      additionalProperties: false
      properties:
        id_token:
          type: string
          description: Firebase Identity Platform ID token.
        new_name: {type: string}
    UpdateMowerNameResponse:
      type: object
      required: [message, mower_id, new_name]
      additionalProperties: false
      properties:
        message: {type: string}
        mower_id: {type: string}
        new_name: {type: string}
    UpdateUserEmailRequest:
      type: object
      required: [id_token, new_id_token]
      additionalProperties: false
      properties:
        id_token:
          type: string
          description: Firebase Identity Platform ID token for the current account email.
        new_id_token:
          type: string
          description: Firebase Identity Platform ID token containing the new email.
    UpdateUserEmailResponse:
      type: object
      required: [message, user_id, new_email]
      additionalProperties: false
      properties:
        message: {type: string}
        user_id: {type: string}
        new_email: {type: string}
    UserLoginResponse:
      type: object
      required: [user_id, token, expires_in, user_data]
      properties:
        user_id: {type: string}
        token:
          type: string
          description: Application JWT signed with JWT_SECRET.
        expires_in: {type: integer, example: 300}
        user_data:
          $ref: '#/components/schemas/UserData'
    UserData:
      type: object
      required: [id, email, name, mowers]
      additionalProperties: true
      properties:
        id: {type: string}
        email: {type: string}
        name: {type: string}
        created_at: {type: string, format: date-time, nullable: true}
        mowers:
          type: array
          items: {type: string}
          description: IDs of the mowers owned by this user.
    LiveKitConsumeRequest:
      type: object
      additionalProperties: false
      description: Empty request; mower_id is taken from the Zenoh channel path.
    LiveKitUploadRequest:
      type: object
      additionalProperties: false
      description: Empty request; mower_id is taken from the Zenoh channel path.
    LiveKitTokenResponse:
      type: object
      required: [token, url, expires_in]
      properties:
        token:
          type: string
          description: Signed LiveKit room access token.
        url:
          type: string
          format: uri
          description: LiveKit WebSocket endpoint used to connect.
        expires_in: {type: integer, example: 3600}
    JoystickCommand:
      type: object
      required: [x, y]
      additionalProperties: false
      description: Normalized manual drive vector, where each axis ranges from -1 to 1.
      properties:
        x: {type: number, minimum: -1, maximum: 1}
        y: {type: number, minimum: -1, maximum: 1}
    MowerCommandRequest:
      oneOf:
        - {$ref: '#/components/schemas/EmergencyStopCommand'}
        - {$ref: '#/components/schemas/SetPowerCommand'}
        - {$ref: '#/components/schemas/SetModeCommand'}
    EmergencyStopCommand:
      type: object
      required: [command_id, type]
      additionalProperties: false
      properties:
        command_id: {type: string}
        type: {const: emergency_stop}
    SetPowerCommand:
      type: object
      required: [command_id, type, enabled]
      additionalProperties: false
      properties:
        command_id: {type: string}
        type: {const: set_power}
        enabled: {type: boolean}
    SetModeCommand:
      type: object
      required: [command_id, type, mode]
      additionalProperties: false
      properties:
        command_id: {type: string}
        type: {const: set_mode}
        mode: {type: string, enum: [manual, auto]}
    MowerCommandResponse:
      type: object
      required: [command_id, status]
      additionalProperties: false
      properties:
        command_id: {type: string}
        status: {type: string, enum: [accepted, rejected]}
        reason: {type: string}
    TelemetryHistoryRequest:
      type: object
      required: [id_token]
      additionalProperties: false
      properties:
        id_token:
          type: string
          description: Firebase Identity Platform ID token.
        cursor:
          type: string
          nullable: true
          description: Opaque next_cursor returned by the previous page. Omit for the newest 60 points.
    TelemetryHistoryPoint:
      type: object
      required: [timestamp, value]
      additionalProperties: false
      properties:
        timestamp: {type: string, format: date-time}
        value: {type: number}
    TelemetryHistoryResponse:
      type: object
      required: [telemetry_type, limit, total, has_more, next_cursor, points]
      additionalProperties: false
      properties:
        telemetry_type: {type: string}
        limit: {type: integer, example: 60}
        total: {type: integer}
        has_more: {type: boolean}
        next_cursor: {type: string, nullable: true}
        points:
          type: array
          items: {$ref: '#/components/schemas/TelemetryHistoryPoint'}
    ImuTelemetry:
      type: object
      required: [accel_x, accel_y, accel_z, gyro_x, gyro_y, gyro_z, mag_x, mag_y, mag_z]
      additionalProperties: false
      properties:
        accel_x: {type: number}
        accel_y: {type: number}
        accel_z: {type: number}
        gyro_x: {type: number}
        gyro_y: {type: number}
        gyro_z: {type: number}
        mag_x: {type: number}
        mag_y: {type: number}
        mag_z: {type: number}
    TelemetryRecord:
      type: object
      required: [mower_id, timestamp, latitude, longitude, battery_percentage]
      additionalProperties: false
      properties:
        mower_id: {type: string}
        timestamp: {type: string, format: date-time}
        latitude: {type: number}
        longitude: {type: number}
        battery_percentage: {type: integer}
        left_motor_speed: {type: number, default: 0}
        left_motor_direction: {type: integer, default: 0, enum: [-1, 0, 1]}
        right_motor_speed: {type: number, default: 0}
        right_motor_direction: {type: integer, default: 0, enum: [-1, 0, 1]}
        cutting_motor_speed: {type: number, default: 0}
        slippage_detected: {type: boolean, default: false}
        imu_data:
          nullable: true
          allOf: [{$ref: '#/components/schemas/ImuTelemetry'}]
    TelemetryList:
      type: array
      items: {$ref: '#/components/schemas/TelemetryRecord'}
    CutoutUploadUrlRequest:
      type: object
      required: [id_token, mower_ids, content_type]
      additionalProperties: false
      properties:
        id_token: {type: string, description: Firebase Identity Platform ID token.}
        mower_ids:
          type: array
          minItems: 1
          items: {type: string}
          description: Owned mowers that should receive this cutout.
        content_type:
          type: string
          enum: [image/png, image/jpeg, image/webp]
    CutoutUploadUrlResponse:
      type: object
      required: [cutout_id, upload_url, expires_in, object_key, content_type]
      additionalProperties: false
      properties:
        cutout_id: {type: string}
        upload_url: {type: string, format: uri}
        expires_in: {type: integer}
        object_key: {type: string}
        content_type: {type: string}
    CutoutUploadNotification:
      type: object
      required: [id_token, cutout_id, success]
      additionalProperties: false
      properties:
        id_token: {type: string, description: Firebase Identity Platform ID token.}
        cutout_id: {type: string}
        success: {type: boolean}
        failure_reason: {type: string}
    MowerCutoutDownloadUrlRequest:
      type: object
      additionalProperties: false
      description: Empty request; mower identity is constrained by its Zenoh ACL and channel path.
    MowerCutoutDownloadUrlResponse:
      type: object
      required: [cutout_id, download_url, expires_in, content_type]
      additionalProperties: false
      properties:
        cutout_id: {type: string}
        download_url: {type: string, format: uri}
        expires_in: {type: integer}
        content_type: {type: string}
    MowerCertificateRenewChallengeRequest:
      type: object
      additionalProperties: false
      description: Empty request. The mower identity is taken from the scoped bootstrap path.
    MowerCertificateRenewChallengeResponse:
      type: object
      required: [nonce, expires_in]
