asyncapi: 3.0.0
info:
  title: Emi Mower Zenoh API
  version: 1.0.0
  description: >-
    The user/login exchange accepts a Firebase ID token and returns an
    application JWT signed with JWT_SECRET. Authenticated user and mower
    operations accept a Firebase ID token and return a typed reply. LiveKit
    query paths issue room-scoped tokens for either an app consumer or a mower
    publisher.
servers:
  public:
    host: localhost:7447
    protocol: wss
    description: Public Zenoh router endpoint
channels:
  userLogin:
    address: user/login
    messages:
      userLoginRequest: {$ref: '#/components/messages/UserLoginRequest'}
      userLoginResponse: {$ref: '#/components/messages/UserLoginResponse'}
      problemDetails: {$ref: '#/components/messages/ProblemDetails'}
  addMowerToUser:
    address: user/add_mower
    messages:
      addMowerToUserRequest: {$ref: '#/components/messages/AddMowerToUserRequest'}
      addMowerToUserResponse: {$ref: '#/components/messages/AddMowerToUserResponse'}
      problemDetails: {$ref: '#/components/messages/ProblemDetails'}
  updateUserName:
    address: user/update_name
    messages:
      updateUserNameRequest: {$ref: '#/components/messages/UpdateUserNameRequest'}
      updateUserNameResponse: {$ref: '#/components/messages/UpdateUserNameResponse'}
      problemDetails: {$ref: '#/components/messages/ProblemDetails'}
  updateMowerName:
    address: mower/{mower_id}/update_name
    parameters:
      mower_id:
        description: Mower whose name is being updated.
        schema: {type: string}
    messages:
      updateMowerNameRequest: {$ref: '#/components/messages/UpdateMowerNameRequest'}
      updateMowerNameResponse: {$ref: '#/components/messages/UpdateMowerNameResponse'}
      problemDetails: {$ref: '#/components/messages/ProblemDetails'}
  updateUserEmail:
    address: user/update_email
    messages:
      updateUserEmailRequest: {$ref: '#/components/messages/UpdateUserEmailRequest'}
      updateUserEmailResponse: {$ref: '#/components/messages/UpdateUserEmailResponse'}
      problemDetails: {$ref: '#/components/messages/ProblemDetails'}
  livekitConsume:
    address: mower/{mower_id}/livekit/consume
    parameters:
      mower_id:
        description: Mower room to consume.
        schema: {type: string}
    messages:
      livekitConsumeRequest: {$ref: '#/components/messages/LiveKitConsumeRequest'}
      livekitTokenResponse: {$ref: '#/components/messages/LiveKitTokenResponse'}
      problemDetails: {$ref: '#/components/messages/ProblemDetails'}
  livekitUpload:
    address: mower/{mower_id}/livekit/upload
    parameters:
      mower_id:
        description: Mower room to publish.
        schema: {type: string}
    messages:
      livekitUploadRequest: {$ref: '#/components/messages/LiveKitUploadRequest'}
      livekitTokenResponse: {$ref: '#/components/messages/LiveKitTokenResponse'}
      problemDetails: {$ref: '#/components/messages/ProblemDetails'}
operations:
  userLogin:
    action: receive
    channel: {$ref: '#/channels/userLogin'}
    summary: Exchange a Firebase ID token for an Emi Mower JWT
    messages:
      - {$ref: '#/channels/userLogin/messages/userLoginRequest'}
    reply:
      channel: {$ref: '#/channels/userLogin'}
      messages:
        - {$ref: '#/channels/userLogin/messages/userLoginResponse'}
        - {$ref: '#/channels/userLogin/messages/problemDetails'}
  addMowerToUser:
    action: receive
    channel: {$ref: '#/channels/addMowerToUser'}
    summary: Assign an unowned mower to the authenticated user
    messages:
      - {$ref: '#/channels/addMowerToUser/messages/addMowerToUserRequest'}
    reply:
      channel: {$ref: '#/channels/addMowerToUser'}
      messages:
        - {$ref: '#/channels/addMowerToUser/messages/addMowerToUserResponse'}
        - {$ref: '#/channels/addMowerToUser/messages/problemDetails'}
  updateUserName:
    action: receive
    channel: {$ref: '#/channels/updateUserName'}
    summary: Update the authenticated user's name
    messages:
      - {$ref: '#/channels/updateUserName/messages/updateUserNameRequest'}
    reply:
      channel: {$ref: '#/channels/updateUserName'}
      messages:
        - {$ref: '#/channels/updateUserName/messages/updateUserNameResponse'}
        - {$ref: '#/channels/updateUserName/messages/problemDetails'}
  updateMowerName:
    action: receive
    channel: {$ref: '#/channels/updateMowerName'}
    summary: Update the name of a mower owned by the authenticated user
    messages:
      - {$ref: '#/channels/updateMowerName/messages/updateMowerNameRequest'}
    reply:
      channel: {$ref: '#/channels/updateMowerName'}
      messages:
        - {$ref: '#/channels/updateMowerName/messages/updateMowerNameResponse'}
        - {$ref: '#/channels/updateMowerName/messages/problemDetails'}
  updateUserEmail:
    action: receive
    channel: {$ref: '#/channels/updateUserEmail'}
    summary: Update the authenticated user's email from a verified ID token
    messages:
      - {$ref: '#/channels/updateUserEmail/messages/updateUserEmailRequest'}
    reply:
      channel: {$ref: '#/channels/updateUserEmail'}
      messages:
        - {$ref: '#/channels/updateUserEmail/messages/updateUserEmailResponse'}
        - {$ref: '#/channels/updateUserEmail/messages/problemDetails'}
  livekitConsume:
    action: receive
    channel: {$ref: '#/channels/livekitConsume'}
    summary: Issue an app-user token for consuming a mower's LiveKit room
    messages:
      - {$ref: '#/channels/livekitConsume/messages/livekitConsumeRequest'}
    reply:
      channel: {$ref: '#/channels/livekitConsume'}
      messages:
        - {$ref: '#/channels/livekitConsume/messages/livekitTokenResponse'}
        - {$ref: '#/channels/livekitConsume/messages/problemDetails'}
  livekitUpload:
    action: receive
    channel: {$ref: '#/channels/livekitUpload'}
    summary: Issue a mower token for uploading to its LiveKit room
    messages:
      - {$ref: '#/channels/livekitUpload/messages/livekitUploadRequest'}
    reply:
      channel: {$ref: '#/channels/livekitUpload'}
      messages:
        - {$ref: '#/channels/livekitUpload/messages/livekitTokenResponse'}
        - {$ref: '#/channels/livekitUpload/messages/problemDetails'}
components:
  messages:
    UserLoginRequest:
      name: UserLoginRequest
      payload: {$ref: '#/components/schemas/UserLoginRequest'}
    UserLoginResponse:
      name: UserLoginResponse
      payload: {$ref: '#/components/schemas/UserLoginResponse'}
    AddMowerToUserRequest:
      name: AddMowerToUserRequest
      payload: {$ref: '#/components/schemas/AddMowerToUserRequest'}
    AddMowerToUserResponse:
      name: AddMowerToUserResponse
      payload: {$ref: '#/components/schemas/AddMowerToUserResponse'}
    UpdateUserNameRequest:
      name: UpdateUserNameRequest
      payload: {$ref: '#/components/schemas/UpdateUserNameRequest'}
    UpdateUserNameResponse:
      name: UpdateUserNameResponse
      payload: {$ref: '#/components/schemas/UpdateUserNameResponse'}
    UpdateMowerNameRequest:
      name: UpdateMowerNameRequest
      payload: {$ref: '#/components/schemas/UpdateMowerNameRequest'}
    UpdateMowerNameResponse:
      name: UpdateMowerNameResponse
      payload: {$ref: '#/components/schemas/UpdateMowerNameResponse'}
    UpdateUserEmailRequest:
      name: UpdateUserEmailRequest
      payload: {$ref: '#/components/schemas/UpdateUserEmailRequest'}
    UpdateUserEmailResponse:
      name: UpdateUserEmailResponse
      payload: {$ref: '#/components/schemas/UpdateUserEmailResponse'}
    ProblemDetails:
      name: ProblemDetails
      payload: {$ref: '#/components/schemas/ProblemDetails'}
    LiveKitConsumeRequest:
      name: LiveKitConsumeRequest
      payload: {$ref: '#/components/schemas/LiveKitConsumeRequest'}
    LiveKitUploadRequest:
      name: LiveKitUploadRequest
      payload: {$ref: '#/components/schemas/LiveKitUploadRequest'}
    LiveKitTokenResponse:
      name: LiveKitTokenResponse
      payload: {$ref: '#/components/schemas/LiveKitTokenResponse'}
  schemas:
    UserLoginRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          description: Firebase Identity Platform ID token.
    AddMowerToUserRequest:
      type: object
      required: [id_token, mower_id]
      additionalProperties: false
      properties:
        id_token:
          type: string
          description: Firebase Identity Platform ID token.
        mower_id: {type: string}
    AddMowerToUserResponse:
      type: object
      required: [message, user_id, mower_id]
      additionalProperties: false
      properties:
        message: {type: string}
        user_id: {type: string}
        mower_id: {type: string}
    UpdateUserNameRequest:
      type: object
      required: [id_token, new_user_name]
      additionalProperties: false
      properties:
        id_token:
          type: string
          description: Firebase Identity Platform ID token.
        new_user_name: {type: string}
    UpdateUserNameResponse:
      type: object
      required: [message, user_id, new_user_name]
      additionalProperties: false
      properties:
        message: {type: string}
        user_id: {type: string}
        new_user_name: {type: string}
    UpdateMowerNameRequest:
      type: object
      required: [id_token, new_name]
      additionalProperties: false
      properties:
        id_token:
          type: string
          description: Firebase Identity Platform ID token.
        new_name: {type: string}
    UpdateMowerNameResponse:
      type: object
      required: [message, mower_id, new_name]
      additionalProperties: false
      properties:
        message: {type: string}
        mower_id: {type: string}
        new_name: {type: string}
    UpdateUserEmailRequest:
      type: object
      required: [id_token, new_id_token]
      additionalProperties: false
      properties:
        id_token:
          type: string
          description: Firebase Identity Platform ID token for the current account email.
        new_id_token:
          type: string
          description: Firebase Identity Platform ID token containing the new email.
    UpdateUserEmailResponse:
      type: object
      required: [message, user_id, new_email]
      additionalProperties: false
      properties:
        message: {type: string}
        user_id: {type: string}
        new_email: {type: string}
    UserLoginResponse:
      type: object
      required: [user_id, token, expires_in, user_data]
      properties:
        user_id: {type: string}
        token:
          type: string
          description: Application JWT signed with JWT_SECRET.
        expires_in: {type: integer, example: 300}
        user_data:
          $ref: '#/components/schemas/UserData'
    UserData:
      type: object
      required: [id, email, name]
      additionalProperties: true
      properties:
        id: {type: string}
        email: {type: string}
        name: {type: string}
        created_at: {type: string, format: date-time, nullable: true}
    LiveKitConsumeRequest:
      type: object
      additionalProperties: false
      description: Empty request; mower_id is taken from the Zenoh channel path.
    LiveKitUploadRequest:
      type: object
      additionalProperties: false
      description: Empty request; mower_id is taken from the Zenoh channel path.
    LiveKitTokenResponse:
      type: object
      required: [token, url, expires_in]
      properties:
        token:
          type: string
          description: Signed LiveKit room access token.
        url:
          type: string
          format: uri
          description: LiveKit WebSocket endpoint used to connect.
        expires_in: {type: integer, example: 3600}
    ProblemDetails:
      type: object
      required: [type, title, status, detail, instance, code, timestamp]
      additionalProperties: true
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string}
        code: {type: string}
        timestamp: {type: string, format: date-time}
