services:
  step-ca:
    build:
      context: .
      dockerfile: Dockerfile.step-ca
    network_mode: host
    environment:
      STEP_CA_NAME: Emi Mower Local Development
      STEP_CA_DNS_NAMES: localhost,step-ca
      STEP_CA_ADDRESS: ":9000"
      STEP_CA_URL: https://localhost:9000
      ZENOH_ROUTER_SANS: localhost,127.0.0.1,host.docker.internal
    volumes:
      - step-ca-data:/home/step
      - backend-identity:/credentials/backend
      - zenoh-mtls-identity:/credentials/zenoh-mtls
      - zenoh-app-identity:/credentials/zenoh-app
      - step-ca-issuer:/credentials/issuer
    healthcheck:
      test: ["CMD-SHELL", "test -f /home/step/credentials-ready && step ca health --ca-url https://localhost:9000 >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      # Keep the container off the common host PostgreSQL port by default.
      POSTGRES_PORT: ${LOCAL_POSTGRES_PORT:-15432}
    network_mode: host
    volumes:
      # PostgreSQL 18 stores data in a versioned subdirectory under this mount.
      - postgres-data:/var/lib/postgresql
    command: ["postgres", "-p", "${LOCAL_POSTGRES_PORT:-15432}"]
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p $${POSTGRES_PORT} -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  valkey:
    image: valkey/valkey:9-alpine
    network_mode: host
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  zenoh-mtls:
    image: eclipse/zenoh:1.9.0
    command: ["-c", "/workspace/zenoh-router-mtls.json5"]
    network_mode: host
    working_dir: /workspace
    volumes:
      - ./:/workspace:ro
      - zenoh-mtls-identity:/run/emi-mower/identity:ro
    depends_on:
      step-ca:
        condition: service_healthy

  zenoh-app:
    build:
      context: .
      dockerfile: Dockerfile.zenoh-app
    command: ["-c", "/workspace/zenoh-router-app.json5"]
    network_mode: host
    working_dir: /workspace
    volumes:
      - ./:/workspace:ro
      - zenoh-app-identity:/run/emi-mower/identity:ro
    depends_on:
      step-ca:
        condition: service_healthy
      zenoh-mtls:
        condition: service_started

  zenoh-bootstrap:
    image: eclipse/zenoh:1.9.0
    command: ["-c", "/workspace/zenoh-router-bootstrap.json5"]
    network_mode: host
    working_dir: /workspace
    volumes:
      - ./:/workspace:ro
      - zenoh-mtls-identity:/run/emi-mower/identity:ro
    depends_on:
      step-ca:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile.local
    working_dir: /workspace
    network_mode: host
    volumes:
      - ./:/workspace
      - uv-cache:/root/.cache/uv
      - backend-identity:/run/emi-mower/identity:ro
      - step-ca-issuer:/run/emi-mower/issuer:ro
    environment:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: ${LOCAL_POSTGRES_PORT:-15432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      VALKEY_HOST: 127.0.0.1
      VALKEY_PORT: ${VALKEY_PORT:-6379}
      ZENOH_APP_REST_URL: ${ZENOH_APP_REST_URL:-http://127.0.0.1:8001}
      ZENOH_MTLS_REST_URL: ${ZENOH_MTLS_REST_URL:-http://127.0.0.1:8002}
      ZENOH_BOOTSTRAP_ENDPOINT: ${ZENOH_BOOTSTRAP_ENDPOINT:-tls/127.0.0.1:7449}
      STEP_CA_URL: https://localhost:9000
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-emi-mower}
      GCS_CUTOUT_BUCKET: ${GCS_CUTOUT_BUCKET:-emi-mower-cutouts-sandbox}
    command:
      - sh
      - -c
      - >-
        pip install --disable-pip-version-check uv >/dev/null &&
        uv sync --frozen &&
        uv run alembic upgrade head &&
        uv run uvicorn src.main:app --host 0.0.0.0 --port 8000
    depends_on:
      step-ca:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      zenoh-mtls:
        condition: service_started
      zenoh-app:
        condition: service_started
      zenoh-bootstrap:
        condition: service_started
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  upload-telemetry:
    image: python:3.12-slim
    working_dir: /workspace
    network_mode: host
    volumes:
      - ./:/workspace
      - uv-cache:/root/.cache/uv
    environment:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: ${LOCAL_POSTGRES_PORT:-15432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      VALKEY_HOST: 127.0.0.1
      VALKEY_PORT: ${VALKEY_PORT:-6379}
    command:
      - sh
      - -c
      - >-
        pip install --disable-pip-version-check uv >/dev/null &&
        uv sync --frozen &&
        uv run python -m src.scripts.upload_telemetry_data
    depends_on:
      backend:
        condition: service_healthy

  add-all-acls:
    image: python:3.12-slim
    working_dir: /workspace
    network_mode: host
    volumes:
      - ./:/workspace
      - uv-cache:/root/.cache/uv
    environment:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: ${LOCAL_POSTGRES_PORT:-15432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      VALKEY_HOST: 127.0.0.1
      VALKEY_PORT: ${VALKEY_PORT:-6379}
      ZENOH_APP_REST_URL: ${ZENOH_APP_REST_URL:-http://127.0.0.1:8001}
      ZENOH_MTLS_REST_URL: ${ZENOH_MTLS_REST_URL:-http://127.0.0.1:8002}
    command:
      - sh
      - -c
      - >-
        pip install --disable-pip-version-check uv >/dev/null &&
        uv sync --frozen &&
        uv run python -m src.scripts.add_all_acls
    depends_on:
      backend:
        condition: service_healthy

  remove-usrpwds:
    image: python:3.12-slim
    working_dir: /workspace
    network_mode: host
    volumes:
      - ./:/workspace
      - uv-cache:/root/.cache/uv
    environment:
      VALKEY_HOST: 127.0.0.1
      VALKEY_PORT: ${VALKEY_PORT:-6379}
      ZENOH_APP_REST_URL: ${ZENOH_APP_REST_URL:-http://127.0.0.1:8001}
    command:
      - sh
      - -c
      - >-
        pip install --disable-pip-version-check uv >/dev/null &&
        uv sync --frozen &&
        uv run python -m src.scripts.remove_usrpwds_from_zenoh
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  valkey-data:
  uv-cache:
  step-ca-data:
  step-ca-issuer:
  backend-identity:
  zenoh-mtls-identity:
  zenoh-app-identity:
