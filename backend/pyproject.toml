[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "cloud-sql-python-connector[asyncpg]>=1.20.3",
    "eclipse-zenoh>=1.9.0",
    "fastapi>=0.138.0",
    "firebase-admin>=7.4.0",
    "google-cloud-storage>=3.12.0",
    "motor>=3.7.1",
    "pyjwt[crypto]>=2.13.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.49.0",
    "valkey>=6.1.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.19",
    "testcontainers[postgres,redis]>=4.15.0",
]

[tool.ruff]
# Target Python version
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# Enable Pyflakes (F), Pycodestyle (E, W), and Isort (I)
select = ["E", "F", "W", "I"]
fixable = ["ALL"]

[tool.ruff.format]
# Use double quotes for strings (just like Prettier defaults!)
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = ["--cov=src", "--cov-report=term-missing", "--cov-fail-under=80"]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "repository: direct Postgres and Valkey cache-aside integration test",
    "api: full Docker Compose API integration test",
    "zenoh_integration: integration test against the Zenoh router services",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["src/scripts/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
